<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F4F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Книги">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Книжный дневник</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Philosopher:wght@700&display=swap">
<style>
/* Layout: one calm column. Tabs (неделя / месяц / год / портрет / полка), period bar, coach line, summary, then the view. Add button floats bottom-right. Palette: soft pink, fresh green, pale blue, warm off-white. */
:root{
  --bg:#F7F4F3; --surface:#FFFFFF; --surface2:#F0ECEF; --ink:#2F2938; --muted:#6C6475; --line:#E6E0E6;
  --primary:#E89FC4; --primary-ink:#33202F; --ptext:#B04A83;
  --audio:#769A26; --ebook:#D9709F; --print:#5B93CF; --ok:#4E8C4A; --heat:#E08AB2; --danger:#B3261E;
  --g1:#D9709F; --g2:#769A26; --g3:#5B93CF; --g4:#E0A055; --g5:#8A7FD0; --g6:#4FA39A;
  --dr-body:#2E7355; --dr-body2:#1F5640; --dr-belly:#CFDD9A; --dr-wing:#3F8F6B; --dr-wing2:#2A6A50; --dr-horn:#F4EFE6; --dr-ink:#14231C; --dr-eye:#F2B544; --dr-cheek:#E89FC4;
  --sky1:#C7DDF3; --sky2:#E3EDF8; --sky3:#F8E4EE; --cloud:rgba(255,255,255,.85); --fly1:#2E7355; --fly2:#D9709F; --fly3:#5B93CF;
  --wood:#E9D5C0; --wood2:#D4B99E; --woodin:#F3E9DE;
  --font-display:'Philosopher','Georgia',serif; --font-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1921; --surface:#2A2430; --surface2:#363040; --ink:#F4EEF6; --muted:#B9B0C2; --line:#463F51;
  --primary:#EDA9CB; --primary-ink:#2B1730; --ptext:#F0A9CB;
  --audio:#C5DA7A; --ebook:#F29CC0; --print:#8DBCEB; --ok:#9BD39A; --heat:#EDA9CB; --danger:#FF8A80;
  --g1:#F29CC0; --g2:#C5DA7A; --g3:#8DBCEB; --g4:#F0BB7C; --g5:#B5AAF0; --g6:#7FD0C6;
  --dr-body:#3E9A74; --dr-body2:#2B7456; --dr-belly:#BFD08A; --dr-wing:#4FA582; --dr-wing2:#357F61; --dr-horn:#EDE6EA; --dr-ink:#0E1A14; --dr-eye:#F2B544; --dr-cheek:#EDA9CB;
  --sky1:#26304A; --sky2:#33304F; --sky3:#46304F; --cloud:rgba(255,255,255,.14); --fly1:#6FC9A1; --fly2:#F29CC0; --fly3:#8DBCEB;
  --wood:#4A3D3A; --wood2:#382E2C; --woodin:#2F2625; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1921; --surface:#2A2430; --surface2:#363040; --ink:#F4EEF6; --muted:#B9B0C2; --line:#463F51;
  --primary:#EDA9CB; --primary-ink:#2B1730; --ptext:#F0A9CB;
  --audio:#C5DA7A; --ebook:#F29CC0; --print:#8DBCEB; --ok:#9BD39A; --heat:#EDA9CB; --danger:#FF8A80;
  --g1:#F29CC0; --g2:#C5DA7A; --g3:#8DBCEB; --g4:#F0BB7C; --g5:#B5AAF0; --g6:#7FD0C6;
  --dr-body:#3E9A74; --dr-body2:#2B7456; --dr-belly:#BFD08A; --dr-wing:#4FA582; --dr-wing2:#357F61; --dr-horn:#EDE6EA; --dr-ink:#0E1A14; --dr-eye:#F2B544; --dr-cheek:#EDA9CB;
  --sky1:#26304A; --sky2:#33304F; --sky3:#46304F; --cloud:rgba(255,255,255,.14); --fly1:#6FC9A1; --fly2:#F29CC0; --fly3:#8DBCEB;
  --wood:#4A3D3A; --wood2:#382E2C; --woodin:#2F2625; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ptext);outline-offset:2px}
.wrap{position:relative;max-width:760px;margin:0 auto;padding-block:22px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.muted{color:var(--muted)}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font:700 30px/1.1 var(--font-display);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.sub::first-letter,.dhead h2::first-letter{text-transform:uppercase}
.streak{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--g4);border:1px solid var(--g4);color:#33202F;font-weight:700;font-size:14px}
.streak .ic{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .streak{background:#C98A3E;border-color:#C98A3E;color:#fff}}
:root[data-theme=dark] .streak{background:#C98A3E;border-color:#C98A3E;color:#fff}
.tabs{display:flex;gap:3px;padding:4px;background:var(--surface2);border-radius:14px;margin-top:18px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:10px;font-weight:600;color:var(--muted);font-size:14px;min-width:0}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(47,41,56,.16)}

.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}
.nav{display:flex;align-items:center;gap:4px;min-width:0}
.nav .label{font:700 20px/1.2 var(--font-display);min-width:8.5em;text-align:center;text-transform:capitalize}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0}
.iconbtn:hover{background:var(--surface2)}
.linkbtn{border:0;background:none;color:var(--ptext);font-weight:600;padding:6px 8px;border-radius:8px}
.filters{display:flex;gap:6px}
.pill{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.pill[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.card h2,.sec h2{font:700 19px/1.2 var(--font-display);margin:0 0 10px}
.coach{margin:16px 0 0;padding:12px 14px;border-radius:14px;background:var(--surface2);display:flex;gap:10px;align-items:flex-start}
.coach .ic{color:var(--ptext);margin-top:2px}
.coach p{margin:0}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums b{display:block;font:700 28px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.nums span{color:var(--muted);font-size:13px}
.nums small{display:block;color:var(--muted);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.share{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface2);margin-top:14px}
.share i{display:block;height:100%}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend .ic{color:var(--c)}
.audio{--c:var(--audio)} .ebook{--c:var(--ebook)} .print{--c:var(--print)} .unk{--c:var(--heat)}
.sec{margin-top:22px}
.sec h3,.sec summary{font:600 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 4px}
.sec summary{cursor:pointer;padding:6px 0;list-style:none}
.sec summary::-webkit-details-marker{display:none}
.sec summary::before{content:"▸ ";}
.sec details[open]>summary::before{content:"▾ ";}

.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 10px;border-radius:999px;border:0;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--ink);font-size:13.5px;font-weight:500;text-align:left}
.chip .ic{color:var(--c)}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip .m{color:var(--muted);font-size:12px;white-space:nowrap}
.chip .fic{width:.9em;height:.9em;color:var(--muted)}

.wrows{margin-top:14px;display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:44px minmax(0,1fr) 38px;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wd{display:flex;flex-direction:column;align-items:center;line-height:1.1;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.wd b{font:700 22px/1.2 var(--font-display);color:var(--ink);text-transform:none;letter-spacing:0}
.wrow.today .wd b{background:var(--primary);color:var(--primary-ink);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.wchips{display:flex;flex-wrap:wrap;gap:6px;min-height:30px;align-items:center}
.none{color:var(--muted);font-size:13px;opacity:.7}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px}
.cal .h{font-size:12px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em;padding-bottom:2px}
.day{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:4px;min-height:64px;padding:5px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left;min-width:0}
.day.has{background:color-mix(in srgb,var(--heat) 12%,var(--surface));border-color:color-mix(in srgb,var(--heat) 28%,var(--line))}
.day .dt{display:flex;justify-content:space-between;align-items:flex-start;width:100%;gap:2px}
.day .dt .dots{justify-content:flex-end;max-width:20px}
.tcov{display:flex;align-items:flex-end;min-height:30px}
.tcov .cov+.cov{margin-left:-10px}
.day:active{transform:scale(.95)}
.day .n{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.day.today .n{color:var(--ptext)}
.day.today{border-color:var(--primary)}
.day.sel{background:var(--surface2);box-shadow:inset 0 0 0 2px var(--primary)}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.fms{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.fm{display:inline-flex}
.fm .ic{width:13px;height:13px;color:var(--c,var(--muted))}
.fm.fic .ic{color:var(--muted)}
.day .dt{flex-wrap:wrap}
.key .fic .ic{color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.dot.fic{border-radius:2px;transform:rotate(45deg) scale(.92)}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.key span{display:inline-flex;gap:6px;align-items:center}
.key .dot{background:var(--muted)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.dhead h2{margin:0}
.drow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 0;border-top:1px solid var(--line)}
.drow:first-of-type{border-top:0}
.drow .ic{color:var(--c);width:22px;height:22px}
.drow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.drow small{color:var(--muted);font-size:13px}
.drow .r{color:var(--muted);font-size:13px;text-align:right;white-space:nowrap}

.brow{display:grid;grid-template-columns:36px 22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.brow:first-of-type{border-top:0}
.fis{display:flex;flex-direction:column;gap:2px;align-items:center;min-width:0}
.fi{color:var(--c,var(--muted));display:inline-flex}
.fi .ic{width:18px;height:18px}
.brow .bt{font-weight:600;overflow-wrap:anywhere}
.brow .bs{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.badge{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.badge.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.badge.star{background:color-mix(in srgb,var(--g1) 16%,var(--surface));color:var(--ptext)}
.badge.gen{background:color-mix(in srgb,var(--g4) 20%,var(--surface));color:color-mix(in srgb,var(--g4) 62%,var(--ink))}
.badge .ic{width:.95em;height:.95em}
.bnum{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.bnum b{display:block;color:var(--ink);font-size:15px}
.acts{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}
.acts .iconbtn{width:34px;height:34px}
.search{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 6px}

.heat{overflow-x:auto;padding-bottom:6px;margin-top:6px}
.hwrap{display:flex;gap:3px;width:max-content}
.hcol{position:relative;display:flex;flex-direction:column;gap:3px;padding-top:16px}
.hl{position:absolute;top:0;left:0;font-size:11px;color:var(--muted);white-space:nowrap}
.hc{width:12px;height:12px;border-radius:3px;background:var(--surface2)}
.hc.off{background:transparent}
.hc[data-l="1"]{background:color-mix(in srgb,var(--heat) 30%,var(--surface2))}
.hc[data-l="2"]{background:color-mix(in srgb,var(--heat) 55%,var(--surface2))}
.hc[data-l="3"]{background:color-mix(in srgb,var(--heat) 78%,var(--surface2))}
.hc[data-l="4"]{background:var(--heat)}
.hdays i{font-style:normal;font-size:11px;color:var(--muted);height:12px;line-height:12px;width:18px}
.mcols{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:150px;margin-top:8px}
.mcol{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;min-width:0}
.mcol .v{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;height:15px}
.mstack{flex:none;width:100%;display:flex;flex-direction:column;justify-content:flex-end;border-radius:6px 6px 3px 3px;overflow:hidden;min-height:2px}
.mstack i{display:block;width:100%}
.mname{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin-top:6px;font-size:11.5px;color:var(--muted);text-align:center}
.mname .cur{color:var(--ink);font-weight:700}
.fmtrow{display:grid;grid-template-columns:110px minmax(0,1fr) 36px;gap:10px;align-items:center;margin-top:10px;font-size:14px}
.fmtrow .nm{display:flex;gap:6px;align-items:center}
.fmtrow .nm .ic{color:var(--c)}
.fmtrow .trk,.grow .trk{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
.fmtrow .trk i{display:block;height:100%;background:var(--c);border-radius:999px}
.fmtrow b{text-align:right;font-variant-numeric:tabular-nums}
.grow{display:grid;grid-template-columns:minmax(96px,1.3fr) minmax(0,2fr) 64px;gap:10px;align-items:center;margin-top:10px;font-size:14px}
.grow .nm{overflow-wrap:anywhere}
.grow .trk i{display:block;height:100%;background:var(--gc,var(--g1));border-radius:999px}
.grow .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.grow .v b{color:var(--ink)}
.prog{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:10px 0 8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g3));border-radius:999px}
.goalline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.goalline b{font:700 24px/1.1 var(--font-display)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.two div{padding:10px 12px;border-radius:12px;background:var(--surface2);font-size:13px;color:var(--muted)}
.two b{display:block;color:var(--ink);font-size:17px;font-family:var(--font-display)}
.portrait{font:700 21px/1.35 var(--font-display);margin:0;text-wrap:pretty}
.portrait span{display:block;margin-top:8px;font:400 15px/1.5 var(--font-body);color:var(--muted)}
.tip{font-size:13px;color:var(--muted);margin:12px 0 0}

.hero{margin-top:18px;padding:26px 20px;border-radius:18px;background:var(--surface);border:1px dashed var(--line);text-align:center}
.hero h2{font:700 24px/1.2 var(--font-display);margin:10px 0 6px;text-wrap:balance}
.hero p{margin:0 auto 16px;max-width:42ch;color:var(--muted)}
.hero .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hero>.ic{width:34px;height:34px;color:var(--ptext)}
.notice{margin-top:14px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--ink);font-size:14px}
.foot{margin-top:28px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:14px}

.btn{border:1px solid var(--primary);background:var(--primary);color:var(--primary-ink);padding:10px 16px;border-radius:12px;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.ghost{background:transparent;color:var(--ptext)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 6px 18px rgba(30,32,72,.3);padding:13px 18px;border-radius:999px}

.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(18,20,43,.55)}
.panel{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:600px){.sheet{align-items:center}.panel{border-radius:20px}}
.panel h2{font:700 22px/1.2 var(--font-display);margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.field>.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:84px}
.seg{display:flex;gap:6px}
.seg button{flex:1;display:inline-flex;gap:6px;align-items:center;justify-content:center;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:500;font-size:14px;min-width:0}
.seg button .ic{color:var(--c,var(--muted))}
.seg button[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);background:var(--surface2);font-weight:600}
.picks{display:flex;flex-direction:column;gap:6px}
.pick{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.pick[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);background:var(--surface2)}
.pick b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.pick small{color:var(--muted);font-size:13px}
.pick .ic{color:var(--c,var(--muted));width:22px;height:22px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.check{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink)}
.check input{width:20px;height:20px;accent-color:var(--primary)}
.foot2{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.foot2 .r{display:flex;gap:8px;margin-left:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;text-align:center}

/* covers */
.cov{display:block;width:36px;height:50px;border-radius:5px;object-fit:cover;object-position:top;flex:none;background:var(--surface2);box-shadow:0 1px 3px rgba(47,41,56,.3)}
.cov.ph{display:grid;place-items:center;color:#fff;font:700 18px/1 var(--font-display);background:linear-gradient(160deg,var(--ph),color-mix(in srgb,var(--ph) 50%,#1E2048))}
.cov.t{width:22px;height:30px;border-radius:3px;font-size:12px}
.cov.s{width:30px;height:42px;border-radius:4px;font-size:14px}
.cov.l{width:74px;height:104px;border-radius:8px;font-size:30px}
.cov.empty{display:grid;place-items:center;border:1.5px dashed var(--line);box-shadow:none;background:var(--surface2);color:var(--muted);font:500 12px var(--font-body)}
.covpick{display:flex;gap:14px;align-items:center}
.covbtns{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.covbtns label.btn{cursor:pointer}
button.covbtn{border:0;background:none;padding:0;border-radius:6px;transition:transform .15s}
button.covbtn:hover{transform:translateY(-3px)}

/* pet scene */
.pet{position:relative;margin-top:16px;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2) 60%,var(--sky3));border:1px solid var(--line);padding:88px 14px 14px}
.pet[hidden]{display:none}
.sky{position:absolute;inset:0 0 auto 0;height:92px;pointer-events:none;overflow:hidden}
.cloud{position:absolute;top:var(--y);left:0;width:var(--w);height:auto;fill:var(--cloud)}
.fly{position:absolute;left:-90px;top:var(--y);width:var(--w);opacity:.92}
.fly svg{display:block;width:100%;height:auto;overflow:visible}
.fly.l svg{transform:scaleX(-1)}
.fly .fb{fill:var(--fc)}
.fly .fk{fill:none;stroke:var(--fc);stroke-linecap:round;stroke-linejoin:round}
.fly .fw{fill:var(--fc);opacity:.62}
.fly .fe{fill:var(--dr-ink)}
.petrow{display:flex;gap:12px;align-items:flex-end}
.dwrap{position:relative;flex:none;width:150px}
.dragon-btn{display:block;border:0;background:none;padding:0;width:150px;height:122px;border-radius:24px;-webkit-tap-highlight-color:transparent}
.dragon{width:150px;height:122px;overflow:visible}
.dragon *{transform-box:fill-box}
.d-all{transform-origin:50% 100%}
.d-wl,.d-wr{transform-origin:100% 92%}
.d-head{transform-origin:33% 78%;transition:transform .5s}
[data-mood="sleep"] .d-head{transform:rotate(14deg)}
.eyes-shut,.eyes-joy,.m-open,.m-sleep,.zzz,.spk{display:none}
[data-mood="sleep"] .eyes-open,[data-mood="sleep"] .m-smile{display:none}
[data-mood="sleep"] .eyes-shut,[data-mood="sleep"] .m-sleep,[data-mood="sleep"] .zzz{display:inline}
[data-mood="joy"] .eyes-open,[data-mood="joy"] .m-smile{display:none}
[data-mood="joy"] .eyes-joy,[data-mood="joy"] .m-open,[data-mood="joy"] .spk{display:inline}
.d-wl,.d-wr{transition:transform .5s}
[data-mood="sleep"] .d-wl{transform:rotate(-24deg) scale(.88)}
[data-mood="sleep"] .d-wr{transform:rotate(-18deg) scale(.9)}
.zzz text{font:700 14px var(--font-display);fill:var(--ptext)}
.bubble{position:absolute;left:66%;top:-6px;width:max-content;max-width:160px;background:var(--surface);color:var(--ink);padding:7px 11px;border-radius:14px 14px 14px 4px;font-size:13px;line-height:1.3;box-shadow:0 4px 14px rgba(30,32,72,.22);z-index:4}
.bubble[hidden]{display:none}
.pinfo{flex:1;min-width:0;padding-bottom:4px}
.psay{font:700 17px/1.25 var(--font-display);margin:0 0 8px;text-wrap:balance}
.pgoal .goalline b{font-size:22px}
.pgoal .prog{margin:8px 0 6px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.pgoal .pace{font-size:13px;color:var(--muted);margin:0}
.pgoal .btn{margin-top:6px;padding:8px 14px}
.nowr{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed color-mix(in srgb,var(--muted) 35%,transparent);font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.nowr .covs{display:flex;gap:6px}
.pt{position:absolute;pointer-events:none;z-index:5;color:var(--g1);animation:ptf 1.3s ease-out forwards}
.pt svg{width:16px;height:16px;display:block}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
#confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:cfall var(--d) cubic-bezier(.25,.6,.4,1) forwards}

/* finished by month (fable style) */
.fhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.fhead b{font:700 40px/1 var(--font-display);color:var(--ptext)}
.fhead span{color:var(--muted)}
.frow{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:center;margin-top:6px}
.frow .fm{font-size:12.5px;color:var(--muted);text-transform:capitalize}
.ftrack{display:flex;height:46px;border-radius:12px;background:var(--surface2);overflow:hidden}
.ffill{display:flex;align-items:center;justify-content:flex-end;gap:0;padding:0 5px;border-radius:12px;background:linear-gradient(90deg,color-mix(in srgb,var(--g3) 55%,var(--surface2)),var(--g3));transform-origin:left}
.ffill .cov{width:26px;height:36px;border-radius:4px;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.ffill .cov+.cov{margin-left:-8px}
.ffill em{font-style:normal;font-weight:700;font-size:12px;color:#fff;margin-left:6px}
.bigstreak{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bigstreak b{font:700 46px/1 var(--font-display);color:var(--ptext)}
.insight{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--surface2);font-size:14px}
.insight .ic{color:var(--ptext)}
.donutw{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut{width:150px;height:150px;flex:none}
.donut circle{fill:none;stroke-width:22}
.dlegend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:8px}
.dlegend div{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;align-items:start;font-size:14px}
.dlegend i{width:12px;height:12px;border-radius:4px;margin-top:3px;background:var(--gc)}
.dlegend small{display:block;color:var(--muted);font-size:12.5px}
.toprow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.topb{position:relative;width:84px;text-align:center;font-size:12px;color:var(--muted)}
.topb .cov{margin:0 auto 6px}
.topb .rt{position:absolute;left:50%;top:84px;transform:translateX(-50%);display:inline-flex;gap:3px;align-items:center;padding:3px 9px;border-radius:999px;background:#FFD66B;color:#3B2A00;font-weight:700;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.topb .rt .ic{width:12px;height:12px}
.topb span.ttl{display:block;margin-top:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* bookcase */
.case{margin-top:12px;padding:10px 8px 2px;border-radius:18px;background:var(--woodin);border:7px solid var(--wood);box-shadow:inset 0 2px 10px rgba(60,40,20,.12),0 2px 6px rgba(60,40,20,.1)}
.sgrp+.sgrp{margin-top:8px;padding-top:2px}
.plaque{display:inline-flex;align-items:center;margin:2px 4px 10px;padding:4px 14px;border-radius:999px;background:var(--primary);color:var(--primary-ink);font:700 14px/1.3 var(--font-display);box-shadow:0 1px 2px rgba(60,40,20,.2)}
.shelf{margin-bottom:2px}
.books{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));align-items:end;gap:2px;padding:0 4px;min-height:84px}
.bk{position:relative;border:0;background:none;padding:0 1px;display:flex;justify-content:center;align-items:flex-end;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bk .cov{width:54px;height:calc(78px*var(--hh,1));border-radius:2px 6px 6px 2px;box-shadow:2px 0 3px rgba(40,25,15,.3),0 1px 2px rgba(40,25,15,.25);font-size:22px}
.bk::before{content:"";position:absolute;left:calc(50% - 27px);bottom:0;width:6px;height:calc(78px*var(--hh,1));border-radius:2px 0 0 2px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.18) 60%,transparent);pointer-events:none;z-index:1}
.bk .rib{position:absolute;top:-3px;right:calc(50% - 22px);width:9px;height:17px;background:var(--ptext);clip-path:polygon(0 0,100% 0,100% 100%,50% 74%,0 100%);z-index:2}
.plank{height:12px;margin:0 -3px;border-radius:3px;background:linear-gradient(var(--wood),var(--wood2));box-shadow:0 3px 5px rgba(40,25,15,.2)}
.caps{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px;padding:5px 4px 12px}
.caps span{font-size:10.5px;line-height:1.25;color:var(--muted);text-align:center;overflow-wrap:anywhere}
.caps b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ghead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 4px 10px}.ghead .plaque{margin:0}
.more{border:0;background:color-mix(in srgb,var(--ptext) 12%,transparent);color:var(--ptext);font:600 12.5px var(--font-body);padding:5px 12px;border-radius:999px;cursor:pointer}
.bk .cov.ph.bc{font-size:0}
.caps b{display:block;font-weight:600;color:var(--ink)}
.bhead{display:flex;gap:14px;align-items:flex-start}
.bhead h2{margin:0 0 4px!important}
.perline{font-weight:600}
.strip{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.sd{width:14px;height:14px;border-radius:4px;background:var(--surface2)}
.sd.audio{background:var(--audio)}.sd.ebook{background:var(--ebook)}.sd.print{background:var(--print)}.sd.unk{background:var(--heat)}
.sd.w1{background:color-mix(in srgb,var(--heat) 30%,var(--surface2))}.sd.w2{background:color-mix(in srgb,var(--heat) 55%,var(--surface2))}.sd.w3{background:color-mix(in srgb,var(--heat) 78%,var(--surface2))}.sd.w4{background:var(--heat)}
.review{margin:0;padding:10px 12px;border-radius:12px;background:var(--surface2);white-space:normal;overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){.bk{transition:transform .15s}.bk:hover,.bk:focus-visible{transform:translateY(-6px)}.bk:active{transform:translateY(-2px) scale(.97)}}

/* animation */
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes cardin{from{opacity:0;transform:translateY(10px)}}
@keyframes spin{from{transform:rotate(-100deg);opacity:0}}
@keyframes ptf{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.15)}}
@keyframes cfall{to{transform:translate(var(--dx),108vh) rotate(var(--r));opacity:.9}}
@keyframes flyR{from{left:-90px}to{left:calc(100% + 20px)}}
@keyframes flyL{from{left:calc(100% + 20px)}to{left:-90px}}
@keyframes bob{50%{transform:translateY(-9px)}}
@keyframes flyA{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-14deg)}}
@keyframes flyB{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(12deg)}}
@keyframes flapA{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-26deg)}}
@keyframes flapB{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(26deg)}}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(18px)}}
@keyframes breathe{50%{transform:scaleY(1.03) scaleX(.99)}}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-7px)}}
@keyframes sway{50%{transform:translateY(-2px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}30%,70%{opacity:1}100%{opacity:0;transform:translate(8px,-12px)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.14) rotate(-5deg)}60%{transform:scale(.97) rotate(4deg)}100%{transform:none}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:no-preference){
  .anim .card,.anim .coach,.anim .hero{animation:cardin .4s both}
  .anim .card:nth-of-type(2){animation-delay:.05s}.anim .card:nth-of-type(3){animation-delay:.1s}.anim .card:nth-of-type(4){animation-delay:.15s}.anim .card:nth-of-type(5){animation-delay:.2s}
  .anim .prog i,.anim .trk i,.anim .share i,.anim .ffill{animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
  .anim .mstack{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom}
  .anim .donut{animation:spin .9s cubic-bezier(.2,.8,.2,1) both}
  .pgoal .prog i{animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
  .fly.r{animation:flyR var(--t) linear var(--dl) infinite}
  .fly.l{animation:flyL var(--t) linear var(--dl) infinite}
  .fly .bobber{animation:bob var(--bt,3s) ease-in-out infinite}
  .fly .wA{animation:flyA .9s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 93%}
  .fly .wB{animation:flyB .9s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
  .cloud{animation:drift var(--ct,16s) ease-in-out infinite alternate}
  [data-mood="sleep"] .d-all{animation:breathe 4s ease-in-out infinite}
  [data-mood="awake"] .d-all{animation:sway 2.6s ease-in-out infinite}
  [data-mood="joy"] .d-all{animation:hop .9s ease-in-out infinite}
  [data-mood="awake"] .d-wl,[data-mood="joy"] .d-wl{animation:flapA 1.1s ease-in-out infinite}
  [data-mood="awake"] .d-wr,[data-mood="joy"] .d-wr{animation:flapA 1.1s ease-in-out -.3s infinite}
  [data-mood="awake"] .eyes-open{animation:blink 5s infinite;transform-origin:50% 50%}
  .zzz text{animation:zz 3s ease-in-out infinite}.zzz text:nth-child(2){animation-delay:1s}.zzz text:nth-child(3){animation-delay:2s}
  .spk path{animation:twinkle 1.6s ease-in-out infinite;transform-origin:50% 50%}.spk path:nth-child(2){animation-delay:.5s}.spk path:nth-child(3){animation-delay:1s}
  .dragon-btn.pop .dragon{animation:pop .7s}
  .dragon-btn.wob .dragon{animation:wob .6s}
  .chip,.btn,.iconbtn{transition:transform .12s,background .15s}
  .chip:hover{transform:translateY(-1px)}.btn:active,.iconbtn:active{transform:scale(.94)}
}
@media (prefers-reduced-motion:reduce){.sky .fly:nth-child(n+2){display:none}.fly{left:20px}#confetti{display:none}}
@media (max-width:420px){.dwrap,.dragon-btn,.dragon{width:134px}.dragon-btn,.dragon{height:109px}.nav .label{min-width:7em;font-size:18px}.fmtrow{grid-template-columns:96px minmax(0,1fr) 30px}.tabs button{font-size:13px}.grow{grid-template-columns:minmax(80px,1.2fr) minmax(0,1.6fr) 58px}}
@media (prefers-reduced-motion:no-preference){.tabs button,.pill,.day{transition:background .15s,border-color .15s}}

  star:svg('<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 17l-5.3 2.7 1.1-5.9L3.5 9.7l5.9-.8z"/>')
};

  audio:{name:'Аудио',icon:IC.audio},
  ebook:{name:'Электронка',icon:IC.ebook},

  unk:{name:'Формат не указан',icon:IC.dash}
};
var FKEYS=['audio','ebook','print'];
var FALL=['audio','ebook','print','unk'];

function hashN(x){var h=0;for(var i=0;i<x.length;i++)h=(h*31+x.charCodeAt(i))>>>0;return h;}
function cover(b,cls){
  cls=cls||'';
  var csrc=b.cover||COVERS[b.id];
  if(csrc)return '<img class="cov '+cls+'" src="'+csrc+'" alt="" draggable="false">';
  var t=String(b.title||'?').replace(/^Пример:\s*/,'');
  return '<span class="cov ph '+cls+'" style="--ph:'+PAL[hashN(String(b.title||b.id))%6]+'" aria-hidden="true">'+esc(t.charAt(0).toUpperCase())+'</span>';

var S={books:[],logs:[],goals:{yearBooks:0},view:'month',cursor:new Date(),filter:'all',sel:todayS(),pScope:'all',q:'',ready:{books:false,logs:false},persist:true,error:''};
var DB=null;
try{var pv=localStorage.getItem('rt-view');if(pv&&['week','month','year','portrait','shelf'].indexOf(pv)>=0)S.view=pv;var pf=localStorage.getItem('rt-filter');if(pf&&['all','book','fanfic'].indexOf(pf)>=0)S.filter=pf;}catch(e){}
function savePref(){try{localStorage.setItem('rt-view',S.view);localStorage.setItem('rt-filter',S.filter);}catch(e){}}

/* ---------- storage ---------- */
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function withRetry(fn){
  for(var i=0;i<4;i++){
    try{return await fn();}
    catch(e){if(e&&(e.code==='resource_exhausted'||e.code==='unavailable')&&i<3){await sleep(500*(i+1)+Math.random()*300);continue;}throw e;}
  }
}
function memSet(path,data){
  var p=path.split('/');
  if(p[0]==='settings'){S.goals=Object.assign({yearBooks:0},data);}
  else{var arr=S[p[0]];var o=Object.assign({id:p[1]},data);var i=arr.findIndex(function(x){return x.id===p[1];});if(i>=0)arr[i]=o;else arr.push(o);}
  render();
}
function memDel(path){var p=path.split('/');S[p[0]]=S[p[0]].filter(function(x){return x.id!==p[1];});render();}
async function setDoc(path,data){if(DB)return withRetry(function(){return DB.doc(path).set(data);});memSet(path,data);}
async function delDoc(path){if(DB)return withRetry(function(){return DB.doc(path).delete();});memDel(path);}
function strip(o){var c=Object.assign({},o);delete c.id;return c;}
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

async function boot(){
  render();
  DB=window.RT_DB||null;
  if(!DB){S.persist=false;S.ready={books:true,logs:true};render();return;}
  var onErr=function(e){S.error=(e&&e.code)||'unavailable';S.ready={books:true,logs:true};render();};
  DB.collection('books').onSnapshot(function(s){S.books=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});S.ready.books=true;render();},onErr);
  DB.collection('logs').onSnapshot(function(s){S.logs=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});S.ready.logs=true;render();},onErr);
  DB.doc('settings/goals').onSnapshot(function(s){S.goals=s.exists?Object.assign({yearBooks:0},s.data()):{yearBooks:0};render();},function(){});
}

/* ---------- derived data ---------- */
function bookById(id){return S.books.find(function(b){return b.id===id;});}
function enriched(){var bm={};S.books.forEach(function(b){bm[b.id]=b;});return S.logs.map(function(l){return Object.assign({},l,{book:bm[l.bookId]});}).filter(function(l){return l.book;});}
function passes(b){return S.filter==='all'||b.kind===S.filter;}
function range(){
  var c=new Date(S.cursor.getFullYear(),S.cursor.getMonth(),S.cursor.getDate());
  if(S.view==='week'){var s=addDays(c,-dow(c));return [s,addDays(s,6)];}
  if(S.view==='year')return [new Date(c.getFullYear(),0,1),new Date(c.getFullYear(),11,31)];
  return [new Date(c.getFullYear(),c.getMonth(),1),new Date(c.getFullYear(),c.getMonth()+1,0)];
}
function sortLogs(a,b){var fa=FKEYS.indexOf(a.format),fb=FKEYS.indexOf(b.format);return fa-fb||String(a.book.title).localeCompare(String(b.book.title),'ru');}
function dayFormats(Lp){var s={};FALL.forEach(function(f){s[f]=new Set();});Lp.forEach(function(l){if(s[l.format])s[l.format].add(l.date);});var o={};FALL.forEach(function(f){o[f]=s[f].size;});return o;}
function stats(Lp){return {days:new Set(Lp.map(function(l){return l.date;})).size,minutes:Lp.reduce(function(s,l){return s+(+l.minutes||0);},0),byF:dayFormats(Lp)};}
function streakOf(L){var set=new Set(L.map(function(l){return l.date;}));var d=new Date();var n=0;if(!set.has(ymd(d)))d=addDays(d,-1);while(set.has(ymd(d))){n++;d=addDays(d,-1);}return n;}
function infoFor(Lx){var m={};Lx.forEach(function(l){var o=m[l.bookId]||(m[l.bookId]={days:new Set(),minutes:0,fm:new Set(),last:'',first:'9999'});o.days.add(l.date);o.minutes+=(+l.minutes||0);o.fm.add(l.format);if(l.date>o.last)o.last=l.date;if(l.date<o.first)o.first=l.date;});return m;}
function lastLogOf(bookId){var best='';S.logs.forEach(function(l){if(l.bookId===bookId&&l.date>best)best=l.date;});return best;}
function lastFmtOf(bookId){var best=null;S.logs.forEach(function(l){if(l.format!=='unk'&&l.bookId===bookId&&(!best||l.date>best.date))best=l;});if(best)return best.format;var any=null;S.logs.forEach(function(l){if(l.format!=='unk'&&(!any||l.date>any.date))any=l;});return any?any.format:'print';}
function doneInYear(year,kind){return S.books.filter(function(b){return b.status==='done'&&(!kind||b.kind===kind)&&b.finishedAt&&b.finishedAt.slice(0,4)===String(year);});}

/* ---------- small renderers ---------- */
function chip(l){
  var b=l.book;
  return '<button class="chip '+l.format+'" data-act="editLog" data-id="'+esc(l.id)+'" title="'+esc(FMT[l.format].name+(b.kind==='fanfic'?', фанфик':''))+'">'+FMT[l.format].icon+(b.kind==='fanfic'?IC.feather.replace('class="ic ','class="ic fic '):'')+'<span class="t">'+esc(b.title)+'</span>'+(l.minutes?'<span class="m">'+l.minutes+' мин</span>':'')+'</button>';
}
function subOf(b){return b.kind==='fanfic'?[b.fandom,b.pairing].filter(Boolean).join(' · '):(b.author||'');}
function fmtMarks(logs){var seen={},fic=false,o='';logs.forEach(function(l){seen[l.format]=1;if(l.book.kind==='fanfic')fic=true;});FALL.forEach(function(f){if(seen[f])o+='<span class="fm '+f+'" title="'+FMT[f].name+'">'+FMT[f].icon+'</span>';});if(fic)o+='<span class="fm fic" title="фанфик">'+IC.feather+'</span>';return '<span class="fms">'+o+'</span>';}
function dots(logs){return '<span class="dots">'+logs.slice(0,6).map(function(l){return '<i class="dot '+l.format+(l.book.kind==='fanfic'?' fic':'')+'"></i>';}).join('')+'</span>';}
function periodOf(b,info){var a=b.startedAt||(info&&info.first&&info.first!=='9999'?info.first:''),z=b.finishedAt||(info&&info.last)||'';if(!a&&!z)return '';if(!a)return short(z);if(!z||z===a)return short(a);return short(a)+' – '+short(z);}
function bookRow(b,info,opt){
  opt=opt||{};
  var fm=info&&info.fm.size?Array.from(info.fm):(b.format?[b.format]:[]);
  var days=info?info.days.size:0, mins=info?info.minutes:0;
  var badges='',per=periodOf(b,info);
  if(b.kind==='fanfic')badges+='<span class="badge">'+IC.feather+'фанфик</span>';
  if(b.genre)badges+='<span class="badge gen">'+esc(b.genre)+'</span>';
  if(b.status==='done')badges+='<span class="badge ok">'+IC.check+'дочитано</span>'+(per?'<span class="badge">'+per+'</span>':'');
  if(b.status==='paused')badges+='<span class="badge">пауза</span>';
  if(b.status==='planned')badges+='<span class="badge">в планах</span>';
  if(+b.rating>0)badges+='<span class="badge star">'+IC.star+b.rating+'</span>';
  if(b.sample)badges+='<span class="badge">пример</span>';

function streakRuns(dates){
  var u=Array.from(new Set(dates)).sort(),runs=[],cur=null;
  u.forEach(function(d){
    if(cur&&ymd(addDays(parse(cur.end),1))===d){cur.end=d;cur.n++;}
    else{cur={start:d,end:d,n:1};runs.push(cur);}
  });
  return runs;
}
function streakCard(L,year){
  var dates=L.map(function(l){return l.date;}),inY=dates.filter(function(d){return d.slice(0,4)===String(year);});
  var runs=streakRuns(inY);
  if(!runs.length)return '';
  var best=runs.reduce(function(m,r){return r.n>m.n?r:m;},runs[0]);
  var cur=(year===new Date().getFullYear())?streakOf(L):0;
  var msg;
  if(cur>=best.n&&cur>1)msg='Ты прямо сейчас на самой длинной серии года!';
  else if(cur>0)msg='Текущая серия — '+cur+' '+pl(cur,['день','дня','дней'])+'. До рекорда года ещё '+(best.n-cur)+'.';
  else msg='Рекордная серия шла с '+short(best.start)+' по '+short(best.end)+'.';
  return '<section class="card"><h2>Серии чтения</h2><div class="bigstreak"><b>'+best.n+'</b><span class="muted">'+pl(best.n,['день','дня','дней'])+' подряд — лучшая серия '+year+'</span></div><p class="insight">'+IC.spark+' <b>Инсайт.</b> '+esc(msg)+'</p></section>';
}
function finCard(fin,year){

  });

function donutCard(gl,gc,gr,avgOf){
  var top=gl.slice(0,6),rest=gl.slice(6).reduce(function(s,g){return s+gc[g];},0),items=top.map(function(g){return {g:g,n:gc[g],r:gr[g]&&gr[g].length?avgOf(gr[g]):0};});
  if(rest)items.push({g:'Другие',n:rest,r:0});
  var tot=items.reduce(function(s,x){return s+x.n;},0),R=54,C=2*Math.PI*R,off=0,gap=items.length>1?3:0;
  var segs=items.map(function(x,i){var len=x.n/tot*C,d=Math.max(1,len-gap),el='<circle cx="70" cy="70" r="'+R+'" stroke="'+(x.g==='Другие'?'var(--muted)':'var(--g'+(i%6+1)+')')+'" stroke-linecap="butt" stroke-dasharray="'+d.toFixed(2)+' '+(C-d).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';off+=len;return el;}).join('');
  return '<section class="card"><h2>Жанры</h2><div class="donutw"><svg class="donut" viewBox="0 0 140 140" role="img" aria-label="Доли жанров"><g transform="rotate(-90 70 70)">'+segs+'</g><text x="70" y="70" text-anchor="middle" font-family="Philosopher,serif" font-weight="700" font-size="30" fill="var(--ink)">'+tot+'</text><text x="70" y="88" text-anchor="middle" font-size="11" fill="var(--muted)">'+pl(tot,['книга','книги','книг'])+'</text></svg><div class="dlegend">'
    +items.map(function(x,i){return '<div style="--gc:'+(x.g==='Другие'?'var(--muted)':'var(--g'+(i%6+1)+')')+'"><i></i><span>'+esc(x.g)+'<small>'+x.n+' '+pl(x.n,['книга','книги','книг'])+(x.r?' · ★'+comma(x.r.toFixed(1)):'')+'</small></span></div>';}).join('')+'</div></div></section>';
}
function topCard(done){

function paceOf(bk){

}
function viewPortrait(){

  var gl=Object.keys(gc).sort(function(x,y){return gc[y]-gc[x]||x.localeCompare(y,'ru');});

  var best=null;gl.forEach(function(g){if(gr[g]&&gr[g].length>=2){var v=avgOf(gr[g]);if(!best||v>best.v+0.001)best={g:g,v:v};}});

/* ---------- sheets ---------- */
var sheet=$('#sheet'),panel=$('.panel',sheet),lastFocus=null,toastT=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},2600);}
function openSheet(html){lastFocus=document.activeElement;panel.innerHTML=html;sheet.hidden=false;document.body.classList.add('lock');panel.scrollTop=0;}
function closeSheet(){sheet.hidden=true;panel.innerHTML='';document.body.classList.remove('lock');if(lastFocus&&lastFocus.focus&&document.contains(lastFocus))lastFocus.focus();}
sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheet.hidden)closeSheet();});
function segHtml(name,items,val){return '<div class="seg" data-seg="'+name+'">'+items.map(function(it){return '<button type="button" class="'+(it.cls||'')+'" data-val="'+it.v+'" aria-pressed="'+(it.v===val)+'">'+(it.icon||'')+it.t+'</button>';}).join('')+'</div>';}
function wireSeg(name,cb){var box=$('[data-seg="'+name+'"]',panel);if(!box)return;box.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;box.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});cb(b.dataset.val);});}
var FMT_ITEMS=FKEYS.map(function(f){return {v:f,t:FMT[f].name,icon:FMT[f].icon,cls:f};});
var RATE_ITEMS=[1,2,3,4,5].map(function(n){return {v:String(n),t:n+'★'};});
var val=function(sel){var el=$(sel,panel);return el?el.value:'';};
function setSeg(name,v){panel.querySelectorAll('[data-seg="'+name+'"] button').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.val===v));});}
function genreOptions(){var set=GENRES.slice();S.books.forEach(function(b){if(b.genre&&set.indexOf(b.genre)<0)set.push(b.genre);});return '<datalist id="genre-list">'+set.map(function(g){return '<option value="'+esc(g)+'"></option>';}).join('')+'</datalist>';}

function openLog(opt){
  opt=opt||{};
  var ed=opt.log||null;
  var date=ed?ed.date:(opt.date||todayS());
  var bookId=ed?ed.bookId:(opt.bookId||'');
  var reading=S.books.filter(function(b){return b.status==='reading'||(!b.status);}).sort(function(x,y){return lastLogOf(y.id).localeCompare(lastLogOf(x.id));});
  var others=S.books.filter(function(b){return reading.indexOf(b)<0&&(b.status!=='done'||b.id===bookId);}).sort(function(x,y){return String(x.title).localeCompare(String(y.title),'ru');});
  if(!S.books.length){openBook({afterSave:function(id){openLog({date:date,bookId:id});}});return;}
  if(!bookId)bookId=reading.length?reading[0].id:'';
  var fmt=ed?ed.format:(bookId?lastFmtOf(bookId):'print');
  var touched=!!ed;
  var picksHtml=reading.length?'<div class="picks" id="lg-picks">'+reading.map(function(b){var f=lastFmtOf(b.id);return '<button type="button" class="pick '+f+'" data-id="'+esc(b.id)+'" aria-pressed="'+(b.id===bookId)+'">'+FMT[f].icon+'<span><b>'+esc(b.title)+'</b><small>'+esc(subOf(b)||(b.kind==='fanfic'?'фанфик':''))+'</small></span></button>';}).join('')+'</div>':'';
  var otherOpts=others.map(function(b){return '<option value="'+esc(b.id)+'"'+(b.id===bookId?' selected':'')+'>'+esc(b.title+(b.status==='planned'?' (в планах)':b.status==='paused'?' (пауза)':b.status==='done'?' (дочитано)':''))+'</option>';}).join('');
  var html='<h2>'+(ed?'Запись о чтении':'Отметить чтение')+'</h2>'
   +'<div class="field"><label for="lg-date">Дата</label><input type="date" id="lg-date" value="'+date+'"></div>'
   +'<div class="field"><span class="lbl">'+(reading.length?'Читаю сейчас':'Что читала')+'</span>'+picksHtml
   +(others.length?'<select id="lg-other" aria-label="Другая книга"><option value="">'+(reading.length?'Другая книга из списка…':'Выбери книгу…')+'</option>'+otherOpts+'</select>':'')
   +'<button type="button" class="linkbtn" id="lg-new" style="align-self:flex-start;padding-left:0">Добавить новую книгу или фанфик</button></div>'
   +'<div class="field"><span class="lbl">В каком формате</span>'+segHtml('fmt',fmt==='unk'?FMT_ITEMS.concat([{v:'unk',t:'Не указан',icon:FMT.unk.icon,cls:'unk'}]):FMT_ITEMS,fmt)+'</div>'
   +'<div class="field"><label for="lg-min">Сколько минут <span style="font-weight:400">(необязательно)</span></label><input type="number" id="lg-min" inputmode="numeric" min="0" max="1440" placeholder="например, 30" value="'+(ed&&ed.minutes?ed.minutes:'')+'"><div class="quick">'+[15,30,60,90].map(function(m){return '<button type="button" class="pill" data-q="'+m+'">'+m+'</button>';}).join('')+'</div></div>'
   +'<div class="field"><label class="check"><input type="checkbox" id="lg-done"> Дочитала в этот день</label></div>'
   +'<div class="field" id="lg-rate" hidden><span class="lbl">Оценка</span>'+segHtml('rate',RATE_ITEMS,'')+'</div>'
   +'<div class="foot2">'+(ed?'<button type="button" class="btn danger" id="lg-del">Удалить запись</button>':'')+'<div class="r"><button type="button" class="btn ghost" data-act="close">Отмена</button><button type="button" class="btn" id="lg-save">Сохранить</button></div></div>';
  openSheet(html);
  var rating=0;
  function pick(id){
    bookId=id;
    panel.querySelectorAll('#lg-picks .pick').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.id===id));});
    var o=$('#lg-other',panel);if(o)o.value=reading.some(function(b){return b.id===id;})?'':id;
    if(!touched&&id){fmt=lastFmtOf(id);setSeg('fmt',fmt);}
  }
  var pk=$('#lg-picks',panel);
  if(pk)pk.addEventListener('click',function(e){var b=e.target.closest('.pick');if(b)pick(b.dataset.id);});
  var oth=$('#lg-other',panel);
  if(oth)oth.addEventListener('change',function(){if(this.value)pick(this.value);else pick(reading.length?reading[0].id:'');});
  if(oth&&bookId&&!reading.some(function(b){return b.id===bookId;}))oth.value=bookId;
  wireSeg('fmt',function(v){fmt=v;touched=true;});
  wireSeg('rate',function(v){rating=+v;});
  $('#lg-done',panel).addEventListener('change',function(){$('#lg-rate',panel).hidden=!this.checked;});
  panel.querySelectorAll('[data-q]').forEach(function(b){b.addEventListener('click',function(){$('#lg-min',panel).value=b.dataset.q;});});
  $('#lg-new',panel).addEventListener('click',function(){var d=val('#lg-date')||date;openBook({afterSave:function(id){openLog({log:ed,date:d,bookId:id});}});});
  var delBtn=$('#lg-del',panel),armed=false;
  if(delBtn)delBtn.addEventListener('click',async function(){
    if(!armed){armed=true;delBtn.textContent='Точно удалить?';return;}
    try{await delDoc('logs/'+ed.id);closeSheet();toast('Запись удалена');}catch(e){toast('Не получилось удалить. Попробуй ещё раз.');}
  });
  $('#lg-save',panel).addEventListener('click',async function(){
    var btn=this,d=val('#lg-date');
    if(!d){toast('Выбери дату');return;}
    if(!bookId){toast('Выбери, что читала');return;}
    var mins=Math.max(0,Math.round(+val('#lg-min')||0));
    var id=d+'_'+bookId+'_'+fmt;
    btn.disabled=true;
    try{
      var minutes=mins;
      if(ed&&ed.id!==id)await delDoc('logs/'+ed.id);
      else if(!ed){var ex=S.logs.find(function(x){return x.id===id;});if(ex)minutes=(+ex.minutes||0)+mins;}
      var doc={date:d,bookId:bookId,format:fmt,minutes:minutes};
      if(ed&&ed.sample)doc.sample=true;
      await setDoc('logs/'+id,doc);
      var bk=bookById(bookId);
      if(bk){
        var nb=strip(bk),changed=false,isDone=$('#lg-done',panel).checked;
        if(isDone){nb.status='done';nb.finishedAt=d;if(rating)nb.rating=rating;changed=true;}
        else if(!ed&&(bk.status==='planned'||bk.status==='paused')){nb.status='reading';changed=true;}
        if(!ed&&(!nb.startedAt||d<nb.startedAt)){nb.startedAt=d;changed=true;}
        if(changed)await setDoc('books/'+bookId,nb);
      }
      S.sel=d;
      var dd=parse(d);S.cursor=new Date(dd.getFullYear(),dd.getMonth(),dd.getDate());
      closeSheet();toast('Записано');render();if(isDone)setTimeout(function(){celebrate();},300);
    }catch(e){btn.disabled=false;toast('Не получилось сохранить. Попробуй ещё раз.');}
  });
}

function openBook(opt){

   +'<div class="field"><span class="lbl">Обложка</span><div class="covpick"><div id="bk-covprev"></div><div class="covbtns"><label class="btn ghost" for="bk-file">Загрузить фото</label><input type="file" id="bk-file" accept="image/*" hidden><button type="button" class="linkbtn" id="bk-covdel" style="padding-left:0">Убрать</button></div></div></div>'

   +'<div class="field"><label for="bk-title">Название</label><input type="text" id="bk-title" value="'+esc(ed?ed.title:'')+'" autocomplete="off"></div>'
   +'<div class="field" id="bk-auth"><label for="bk-author">Автор</label><input type="text" id="bk-author" value="'+esc(ed?ed.author:'')+'" autocomplete="off"></div>'
   +'<div id="bk-fic"><div class="field"><label for="bk-fandom">Фандом</label><input type="text" id="bk-fandom" value="'+esc(ed?ed.fandom:'')+'" autocomplete="off"></div><div class="field"><label for="bk-pair">Пейринг</label><input type="text" id="bk-pair" value="'+esc(ed?ed.pairing:'')+'" autocomplete="off"></div></div>'
   +'<div class="field"><label for="bk-genre">Жанр</label><input type="text" id="bk-genre" list="genre-list" placeholder="выбери или впиши свой" value="'+esc(ed?ed.genre:'')+'" autocomplete="off">'+genreOptions()+'<button type="button" class="linkbtn" id="bk-suggest" style="align-self:flex-start;padding-left:0" hidden>'+IC.spark+' Подсказать жанр</button></div>'
   +'<div class="field"><span class="lbl">Обычно читаю в формате</span>'+segHtml('fmt',FMT_ITEMS,fmt)+'</div>'
   +'<div class="field" id="bk-apply" hidden><label class="check"><input type="checkbox" id="bk-applychk" checked> Поменять формат во всех днях чтения этой книги</label></div>'
   +'<div class="field"><span class="lbl">Статус</span>'+segHtml('status',[{v:'reading',t:'Читаю'},{v:'planned',t:'В планах'},{v:'paused',t:'Пауза'},{v:'done',t:'Дочитано'}],status)+'</div>'
   +'<div id="bk-fin"><div class="field"><label for="bk-fdate">Когда дочитала</label><input type="date" id="bk-fdate" value="'+esc(ed&&ed.finishedAt?ed.finishedAt:'')+'"></div><div class="field"><span class="lbl">Оценка</span>'+segHtml('rate',RATE_ITEMS,rating?String(rating):'')+'</div></div>'
   +'<div class="field"><label for="bk-note">Отзыв</label><textarea id="bk-note" rows="4" placeholder="Коротко: что понравилось, что нет, чем запомнилась книга">'+esc(ed?ed.note:'')+'</textarea></div>'
   +'<div class="foot2">'+(ed?'<button type="button" class="btn danger" id="bk-del">Удалить</button>':'')+'<div class="r"><button type="button" class="btn ghost" data-act="close">Отмена</button><button type="button" class="btn" id="bk-save">Сохранить</button></div></div>';
  openSheet(html);
  function sync(){$('#bk-auth',panel).hidden=kind==='fanfic';$('#bk-fic',panel).hidden=kind!=='fanfic';$('#bk-fin',panel).hidden=status!=='done';}
  function paintCov(){
    var has=cov||(ed&&COVERS[ed.id]);
    $('#bk-covprev',panel).innerHTML=has?cover({id:ed?ed.id:'x',title:val('#bk-title')||'?',cover:cov},'l'):'<span class="cov l empty">нет</span>';
    $('#bk-covdel',panel).hidden=!cov;
  }
  paintCov();
  $('#bk-title',panel).addEventListener('input',function(){if(!cov&&!(ed&&COVERS[ed.id]))return;});
  $('#bk-covdel',panel).addEventListener('click',function(){cov='';paintCov();});
  $('#bk-file',panel).addEventListener('change',function(){
    var f=this.files&&this.files[0];if(!f)return;
    var img=new Image(),url=URL.createObjectURL(f);
    img.onload=function(){
      var mx=380,k=Math.min(1,mx/Math.max(img.width,img.height)),cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(img.width*k));cv.height=Math.max(1,Math.round(img.height*k));
      var cx=cv.getContext('2d');cx.drawImage(img,0,0,cv.width,cv.height);
      var q=.84,out=cv.toDataURL('image/jpeg',q);
      while(out.length>140000&&q>.4){q-=.12;out=cv.toDataURL('image/jpeg',q);}

  wireSeg('status',function(v){status=v;sync();});
  wireSeg('rate',function(v){rating=+v;});
  var sug=$('#bk-suggest',panel);

    window.claude.use('sample').then(function(cap){
      if(!cap||!document.contains(sug))return;
      sug.hidden=false;
      sug.addEventListener('click',async function(){
        var title=val('#bk-title').trim();
        if(!title){toast('Сначала напиши название');return;}

          var g=String(r&&r.text||'').trim().replace(/[.«»"]/g,'');
          if(g&&g.length<=40)$('#bk-genre',panel).value=g;else toast('Не получилось определить жанр');
        }catch(e){toast('Не получилось определить жанр');}
        sug.disabled=false;
      });
    }).catch(function(){});
  }
  var delBtn=$('#bk-del',panel),armed=false;
  if(delBtn)delBtn.addEventListener('click',async function(){
    if(!armed){armed=true;delBtn.textContent='Удалить вместе с записями?';return;}
    delBtn.disabled=true;
    try{
      var mine=S.logs.filter(function(l){return l.bookId===ed.id;});
      for(var i=0;i<mine.length;i++)await delDoc('logs/'+mine[i].id);
      await delDoc('books/'+ed.id);closeSheet();toast('Удалено');
    }catch(e){delBtn.disabled=false;toast('Не получилось удалить. Попробуй ещё раз.');}
  });
  $('#bk-save',panel).addEventListener('click',async function(){
    var btn=this,title=val('#bk-title').trim();
    if(!title){toast('Напиши название');$('#bk-title',panel).focus();return;}
    var doc={title:title,kind:kind,author:kind==='book'?val('#bk-author').trim():'',fandom:kind==='fanfic'?val('#bk-fandom').trim():'',pairing:kind==='fanfic'?val('#bk-pair').trim():'',genre:val('#bk-genre').trim(),format:fmt,status:status,startedAt:ed&&ed.startedAt?ed.startedAt:'',finishedAt:status==='done'?(val('#bk-fdate')||(ed&&ed.finishedAt)||''):'',rating:status==='done'?rating:(ed?(+ed.rating||0):0),note:val('#bk-note').trim()};
    if(cov)doc.cover=cov;
    if(status==='done'&&!doc.finishedAt)doc.finishedAt=todayS();
    if(ed&&ed.sample)doc.sample=true;
    if(ed&&ed.imported)doc.imported=true;
    var id=ed?ed.id:newId('b');
    btn.disabled=true;
    try{
      await setDoc('books/'+id,doc);
      if(ed&&fmt&&!$('#bk-apply',panel).hidden&&$('#bk-applychk',panel).checked){
        for(var i=0;i<mineLogs.length;i++){
          var l=mineLogs[i];if(l.format===fmt)continue;
          var nid=l.date+'_'+l.bookId+'_'+fmt,ex=S.logs.find(function(x){return x.id===nid;});
          var nd={date:l.date,bookId:l.bookId,format:fmt,minutes:(+l.minutes||0)+(ex?(+ex.minutes||0):0)};
          if(l.fable)nd.fable=true;if(l.sample)nd.sample=true;

      closeSheet();toast('Сохранено');
      if(status==='done'&&(!ed||ed.status!=='done'))setTimeout(function(){celebrate();},300);
      if(opt.afterSave)opt.afterSave(id);
    }catch(e){btn.disabled=false;toast('Не получилось сохранить. Попробуй ещё раз.');}
  });
}

  toast('Загружаю пример…');
  try{
    for(var i=0;i<defs.length;i++){

        var h=(d*7+i*5)%10;if(h>=6)continue;
        var ds=ymd(addDays(T0,-d));

      }
    }
    S.view='month';S.cursor=new Date();S.sel=todayS();savePref();render();toast('Пример загружен. Его можно убрать внизу страницы.');
  }catch(e){toast('Пример загрузился не полностью. Нажми «Убрать примеры» и попробуй снова.');}
  busy=false;
}
async function clearSample(){
  if(busy)return;busy=true;toast('Убираю примеры…');
  try{
    var sb=S.books.filter(function(b){return b.sample;}).map(function(b){return b.id;});
    var sl=S.logs.filter(function(l){return l.sample||sb.indexOf(l.bookId)>=0;});
    for(var i=0;i<sl.length;i++)await delDoc('logs/'+sl[i].id);
    for(var j=0;j<sb.length;j++)await delDoc('books/'+sb[j]);
    toast('Примеры убраны');
  }catch(e){toast('Убрались не все примеры. Нажми ещё раз.');}
  busy=false;
}

/* ---------- events ---------- */
function shift(n){
  var c=S.cursor;
  if(S.view==='week')S.cursor=addDays(c,7*n);
  else if(S.view==='year')S.cursor=new Date(c.getFullYear()+n,c.getMonth(),1);
  else S.cursor=new Date(c.getFullYear(),c.getMonth()+n,1);
  render();
}
var H={
  view:function(t){S.view=t.dataset.v;savePref();render();},
  prev:function(){shift(-1);},
  next:function(){shift(1);},
  now:function(){S.cursor=new Date();S.sel=todayS();render();},
  filter:function(t){S.filter=t.dataset.f;savePref();render();},
  pscope:function(t){S.pScope=t.dataset.v;render();},
  day:function(t){S.sel=t.dataset.d;render();},
  fab:function(){openLog({date:todayS()});},
  addLog:function(t){openLog({date:t.dataset.d||undefined,bookId:t.dataset.b||undefined});},
  editLog:function(t){var l=S.logs.find(function(x){return x.id===t.dataset.id;});if(l)openLog({log:l});},
  addBook:function(){openBook({});},
  selBook:function(t){openBookDetail(t.dataset.id);},
  toggleGrp:function(t){S.open=S.open||{};S.open[t.dataset.g]=!S.open[t.dataset.g];var e=$('#shelfList');if(e)e.innerHTML=shelfListHtml();},
  editBook:function(t){var b=bookById(t.dataset.id);if(b)openBook({book:b});},
  goals:function(){openGoals();},
  sample:function(){loadSample();},
  clearSample:function(){clearSample();},
  pet:function(){petTap();},
  export:function(){exportData();},
  import:function(){var f=$('#impfile');if(f){f.value='';f.click();}},
  logout:function(){if(window.RT_USER)window.RT_USER.out();},
  close:function(){closeSheet();}
};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t)return;
  var f=H[t.dataset.act];
  if(f)f(t,e);
});
document.addEventListener('change',function(e){if(e.target&&e.target.id==='impfile'&&e.target.files&&e.target.files[0])importData(e.target.files[0]);});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='q'){S.q=e.target.value;var l=$('#shelfList');if(l)l.innerHTML=shelfListHtml();}
});

var rzT=null;window.addEventListener('resize',function(){if(S.view!=='shelf')return;clearTimeout(rzT);rzT=setTimeout(function(){var l=$('#shelfList');if(l)l.innerHTML=shelfListHtml();},150);});
window.RT_START=boot;
})();
</script>

<script type="module">

const firebaseConfig={apiKey:"AIzaSyA6XSLNSBhIh6mhkUzNuZscdZpRuWU7Ri8",authDomain:"reading-tracker-27831.firebaseapp.com",projectId:"reading-tracker-27831",storageBucket:"reading-tracker-27831.firebasestorage.app",messagingSenderId:"585408000354",appId:"1:585408000354:web:3aea1787e66a99f00a7c3b"};
const $=id=>document.getElementById(id);
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
let fs;
try{fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});}
catch(e){fs=initializeFirestore(app,{});}
const provider=new GoogleAuthProvider();
function showErr(e){
  const c=(e&&e.code)||'';
  let t='Не получилось войти. Попробуй ещё раз.';
  if(c==='auth/unauthorized-domain')t='Этот адрес не добавлен в Firebase: Authentication → Settings → Authorized domains.';
  else if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')t='';
  else if(c==='auth/network-request-failed')t='Нет связи с интернетом.';
  $('gerr').textContent=t;
}
$('gbtn').addEventListener('click',async()=>{
  $('gerr').textContent='';
  try{await signInWithPopup(auth,provider);}

    if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){try{await signInWithRedirect(auth,provider);}catch(e2){showErr(e2);}}
    else showErr(e);
  }
});
let started=false;
onAuthStateChanged(auth,u=>{
  if(!u){$('gate').hidden=false;return;}
  $('gate').hidden=true;
  if(started)return;started=true;
  const base='users/'+u.uid+'/';
  const fail=e=>{console.error(e);if(window.RT_ERR)window.RT_ERR(e);};
  window.RT_DB={
    doc:p=>({
      set:d=>{setDoc(doc(fs,base+p),d).catch(fail);return Promise.resolve();},
      delete:()=>{deleteDoc(doc(fs,base+p)).catch(fail);return Promise.resolve();},
      onSnapshot:(ok,err)=>onSnapshot(doc(fs,base+p),s=>ok({exists:s.exists(),data:()=>s.data()}),err)
    }),
    collection:n=>({
      onSnapshot:(ok,err)=>onSnapshot(collection(fs,base+n),s=>ok({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),err)
    })
  };
  window.RT_USER={email:u.email||'',out:()=>signOut(auth).then(()=>location.reload())};
  window.RT_START();
});
</script>
